name: Build Flutter App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate platform folders
        run: flutter create . --platforms=android --project-name=harmony_assistant

      - name: Patch AndroidManifest with mic permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q RECORD_AUDIO "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application|' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Patch project compileSdk to 36
        run: |
          GRADLE_FILE=$(find android/app -maxdepth 1 -name "build.gradle*" | head -n 1)
          echo "Project gradle: $GRADLE_FILE"
          sed -i -E 's/compileSdk(Version)?[ =]+flutter\.compileSdkVersion/compileSdk = 36/g' "$GRADLE_FILE"
          sed -i -E 's/compileSdkVersion[ =]+[0-9]+/compileSdkVersion 36/g' "$GRADLE_FILE"
          sed -i -E 's/compileSdk[ =]+[0-9]+/compileSdk = 36/g' "$GRADLE_FILE"
          grep -n compileSdk "$GRADLE_FILE" || true

      - name: Get dependencies
        run: flutter pub get

      - name: Patch all plugin compileSdk to 36
        run: |
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "PUB_CACHE_DIR=$PUB_CACHE_DIR"
          find "$PUB_CACHE_DIR" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 | while IFS= read -r -d '' f; do
            if grep -qE "compileSdk" "$f"; then
              sed -i -E 's/compileSdk(Version)?[ =]+[0-9]+/compileSdk = 36/g' "$f"
            fi
          done
          echo "---- Verify file_picker ----"
          find "$PUB_CACHE_DIR" -path "*file_picker*" -name "build.gradle*" | while read f; do
            echo "=== $f ==="
            grep -n "compileSdk" "$f" || true
          done

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: harmony-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate platform folders
        run: flutter create . --platforms=windows --project-name=harmony_assistant

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: harmony-assistant-windows
          path: build/windows/x64/runner/Release/
          retention-days: 30
